name: Build beta

on:
  push:
    branches: ["main", "codex/audio-environment-beta", "claude/**"]
    tags: ["v*-beta*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and builder
        run: python -m pip install --upgrade pip && python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Build application bundle
        run: pyinstaller --noconfirm --clean --windowed --name AudioEnvironmentFingerprinter --paths src run_app.py
      - name: Smoke launch Linux GUI
        if: runner.os == 'Linux'
        run: xvfb-run -a ./dist/AudioEnvironmentFingerprinter/AudioEnvironmentFingerprinter
        env:
          AEFP_SMOKE_TEST: "1"
      - name: Smoke launch Windows GUI
        if: runner.os == 'Windows'
        run: .\dist\AudioEnvironmentFingerprinter\AudioEnvironmentFingerprinter.exe
        env:
          AEFP_SMOKE_TEST: "1"
      - name: Upload Linux beta
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: audio-enviro-fingerprint-linux-${{ github.sha }}
          path: dist/AudioEnvironmentFingerprinter/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows beta
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: audio-enviro-fingerprint-windows-${{ github.sha }}
          path: dist/AudioEnvironmentFingerprinter/
          if-no-files-found: error
          retention-days: 30

  release:
    # Milestone releases: push a tag like v0.2.0-beta.1 to publish the Windows (and Linux) builds.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package release assets
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
          sha256sum *.zip > SHA256SUMS.txt
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
