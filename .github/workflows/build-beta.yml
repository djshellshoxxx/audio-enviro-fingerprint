name: Build beta

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub pre-release tagged from __version__ (creates the tag)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and builder
        run: python -m pip install --upgrade pip && python -m pip install . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Build application bundle
        run: pyinstaller --noconfirm --clean --windowed --name AudioEnvironmentFingerprinter --paths src run_app.py
      - name: Smoke launch Linux GUI
        if: runner.os == 'Linux'
        run: xvfb-run -a ./dist/AudioEnvironmentFingerprinter/AudioEnvironmentFingerprinter
        env:
          AEFP_SMOKE_TEST: "1"
      - name: Smoke launch Windows GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\AudioEnvironmentFingerprinter\AudioEnvironmentFingerprinter.exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Smoke launch exit code $($p.ExitCode)"; exit $p.ExitCode }
        env:
          AEFP_SMOKE_TEST: "1"
      - name: Package Linux bundle (preserves executable bit)
        if: runner.os == 'Linux'
        run: tar -czf AudioEnvironmentFingerprinter-linux.tar.gz -C dist AudioEnvironmentFingerprinter
      - name: Upload Linux beta
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: audio-enviro-fingerprint-linux-${{ github.sha }}
          path: AudioEnvironmentFingerprinter-linux.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\AudioEnvironmentFingerprinter -DestinationPath AudioEnvironmentFingerprinter-windows.zip
      - name: Upload Windows beta
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: audio-enviro-fingerprint-windows-${{ github.sha }}
          path: AudioEnvironmentFingerprinter-windows.zip
          if-no-files-found: error
          retention-days: 30

  release:
    # Milestone releases: push a tag like v0.2.0-beta.1 to publish the Windows (and Linux) builds.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag from package version
        id: ver
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/audio_enviro_fingerprint/__init__.py)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$ver" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} != v$ver"; exit 1
          fi
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: Prepare release assets
        run: |
          mkdir artifacts
          cp dl/AudioEnvironmentFingerprinter-windows.zip "artifacts/AudioEnvironmentFingerprinter-windows-${{ steps.ver.outputs.tag }}.zip"
          cp dl/AudioEnvironmentFingerprinter-linux.tar.gz "artifacts/AudioEnvironmentFingerprinter-linux-${{ steps.ver.outputs.tag }}.tar.gz"
          cd artifacts && sha256sum * > SHA256SUMS.txt && ls -l
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/*
