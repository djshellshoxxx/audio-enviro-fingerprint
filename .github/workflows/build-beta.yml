name: Build and release

on:
  push:
    branches: ["main", "claude/**", "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v0.2.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, name: linux-x86_64, ext: tar.gz}
          - {os: windows-latest, name: windows-x86_64, ext: zip}
          - {os: macos-latest, name: macos-arm64, ext: zip}
    runs-on: ${{ matrix.os }}
    env:
      APP: AudioEnvironmentFingerprinter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and builder
        run: python -m pip install --upgrade pip && python -m pip install . pyinstaller
      - name: Install Linux codec and display test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Build application bundle
        run: pyinstaller --noconfirm --clean --windowed --name ${{ env.APP }} --paths src run_app.py

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./dist/$APP/$APP
          ./dist/$APP/$APP --version
        env:
          AEFP_SMOKE_TEST: "1"
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/$APP.app/Contents/MacOS/$APP
          ./dist/$APP.app/Contents/MacOS/$APP --version
        env:
          AEFP_SMOKE_TEST: "1"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\$env:APP\$env:APP.exe" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI smoke test exited with $($p.ExitCode)" }
        env:
          AEFP_SMOKE_TEST: "1"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "audio-enviro-fingerprint-${{ matrix.name }}.tar.gz" -C dist "$APP"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/$APP.app" "audio-enviro-fingerprint-${{ matrix.name }}.zip"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\$env:APP" -DestinationPath "audio-enviro-fingerprint-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: audio-enviro-fingerprint-${{ matrix.name }}
          path: audio-enviro-fingerprint-${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          TARGET: ${{ github.sha }}
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          prerelease=""
          case "$TAG" in *-beta*|*-rc*|*-alpha*) prerelease="--prerelease";; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --target "$TARGET" $prerelease \
            --notes "Unsigned builds for Windows, Linux and macOS (Apple silicon). Each build passed the unit tests and a packaged-GUI smoke test on its own OS in CI. Research software: not forensically validated. macOS: right-click > Open on first launch; Windows: choose 'More info > Run anyway' in SmartScreen. See SHA256SUMS.txt." \
            * || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber *
